<header class="header">
  <div class="nav-wrap">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="assets/logo/LogoGameZone.png" alt="GameZone" />
      <span>GameZone</span>
    </a>

    <!-- Burger -->
    <button
      class="burger"
      type="button"
      (click)="toggleMenu()"
      [class.is-open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="Ouvrir le menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Liens -->
    <nav class="nav" [class.is-open]="menuOpen">
      <a routerLink="/games" routerLinkActive="active" (click)="closeMenu()">Jeux</a>
      <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()">Catégories</a>
      <a routerLink="/news" routerLinkActive="active" (click)="closeMenu()">News</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">À propos</a>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet></router-outlet>
</main>
