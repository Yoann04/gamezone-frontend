<a class="back" routerLink="/news">← Retour news</a>

@if (item) {
<h2>{{ item.title }}</h2>

@if (item.createdAt) {
<p><strong>Date :</strong> {{ item.createdAt | date : 'dd/MM/yyyy' }}</p>
} @if (item.game) {
<p>
  <strong>Jeu :</strong>
  <a [routerLink]="['/games', item.game.slug]">{{ item.game.title }}</a>
</p>
}

<p style="white-space: pre-line">{{ item.content }}</p>
} @else {
<p>Chargement...</p>
}
